name: PHP

on:
  push:
  pull_request:

jobs:
  syntax-and-rows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Detail row checks
        run: php tests/detail-rows-test.php
      - name: Coding standards
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpcs
      - name: Release notes for the current version
        run: |
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' case-study-manager.php | tr -d '\r')
          bash bin/release-notes.sh "$version" case-study-manager.php "$RUNNER_TEMP/release-notes.md"
